name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      # xTB is not installed here, so tests that need real QM calculations are skipped.
      - name: Run tests
        run: python -m pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test the installed wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import peace; from peace.solvents import resolve_solvent; print(peace.__version__, resolve_solvent('water'))"
          peace --help > /dev/null
